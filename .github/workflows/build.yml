name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ["assets-src/**", ".github/workflows/assets.yml", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Reportar errores
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Amanecer.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Amanecer 1.0.${{ github.run_number }}
          make_latest: true
          files: Amanecer.apk
